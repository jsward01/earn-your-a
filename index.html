<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>earn-your-a</title>
    <script>
      // Apply the saved appearance before first paint (no white flash). Same rule as src/lib/theme.ts.
      (function () {
        var c = "system";
        try { c = localStorage.getItem("theme") || "system"; } catch (e) {}
        var dark = c === "dark" || (c !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        // The signed-in person's accent color, cached by src/lib/accent.ts as "<role scale>:<choice>".
        try {
          var a = (localStorage.getItem("accent") || "").split(":");
          if (a.length === 2) {
            document.documentElement.setAttribute("data-accent-src", a[0]);
            document.documentElement.setAttribute("data-accent", a[1]);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
